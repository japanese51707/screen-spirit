# GitHub 只讀 .github/workflows/ 底下的設定。
# 在 GitHub 上自動打包 Windows 版：推送 v 開頭的標籤（例如 v0.2.0）就會打包，放到該版本的 Releases。
# 也可以到 Actions 分頁手動按「Run workflow」，打包結果在那次執行的 Artifacts 下載。
name: 打包 Windows App

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write   # 上傳到 Releases 需要
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: 安裝套件
        run: npm ci
      - name: 打包
        run: npm run package:screen-spirit:win
      - name: 壓縮
        shell: pwsh
        run: Compress-Archive -Path "out/Screen Spirit-win32-x64" -DestinationPath Screen-Spirit-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Screen-Spirit-windows-x64
          path: Screen-Spirit-windows-x64.zip
      - name: 放到 Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Screen-Spirit-windows-x64.zip
