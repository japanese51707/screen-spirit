<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'" />
    <title>選取畫面範圍</title>
    <link rel="stylesheet" href="./selection.css" />
  </head>
  <body>
    <main id="selection-surface" tabindex="-1" aria-label="螢幕圈選區域">
      <div id="screens"></div>
      <div id="selection-box" hidden></div>
      <div id="cursor-spirit" class="cursor-spirit" aria-hidden="true" hidden>
        <svg viewBox="0 0 100 100">
          <path d="M50 8c8 0 12 8 17 13 5 5 15 4 19 12s-1 14 1 21c2 8 10 13 7 22s-12 10-18 16c-6 6-7 17-16 19-8 2-14-6-22-8-8-2-18 3-24-3s-2-16-5-24C6 68-3 62 0 53s14-12 18-19c4-7 3-18 11-22 7-4 14 2 21-1Z" transform="translate(4 2) scale(.92)" fill="#d8d4ff" stroke="#7972b6" stroke-width="4" />
          <ellipse cx="39" cy="48" rx="5" ry="7" fill="#38364e" />
          <ellipse cx="61" cy="48" rx="5" ry="7" fill="#38364e" />
          <path d="M43 63q7 6 14 0" fill="none" stroke="#6f5f9d" stroke-width="4" stroke-linecap="round" />
        </svg>
        <span>✦</span>
      </div>
      <div class="instructions">
        <strong>拖曳圈選要詢問的畫面</strong>
        <span>放開滑鼠完成 · Esc 或「取消圈選」退出</span>
      </div>
      <button id="cancel-selection" class="cancel-selection" type="button">取消圈選</button>
      <div id="selection-error" role="alert" hidden></div>
    </main>
    <script type="module" src="./selection.mjs"></script>
  </body>
</html>
